# Static site behind Traefik; security headers, WAF and rate limiting are
# applied by the global@file middleware at the edge.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css image/svg+xml text/plain application/javascript;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|svg|png|jpg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
