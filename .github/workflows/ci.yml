name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
defaults:
  run:
    working-directory: app
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/swiftproof
      - if: runner.os == 'Linux'
        run: go test -race ./...
      - if: runner.os == 'Linux'
        run: docker pull golang:1.26-bookworm
      - if: runner.os == 'Linux'
        env:
          SWIFTPROOF_TEST_DOCKER_IMAGE: golang:1.26-bookworm
        run: go test ./... -run Docker -count=1 -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache: false
      - name: Build Windows and Linux archives
        shell: bash
        run: go run ./tools/build -version "dev-${GITHUB_SHA:0:12}" -out dist
      - name: Upload Windows and Linux archives
        uses: actions/upload-artifact@v4
        with:
          name: swiftproof-build
          path: |
            app/dist/*.tar.gz
            app/dist/*.zip
            app/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the website image
        run: docker build -t swiftproof-web:ci .
